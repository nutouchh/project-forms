---
- name: Deliver Docker image and deploy Flask app on remote server
  hosts: all
  become: true
  gather_facts: false
  vars:
    image_archive: '{{ playbook_dir }}/../project-forms-image.tar'
    image_name: project-forms
    image_tag: latest
    container_name: project-forms-app
    server_port: 8000
    container_port: 5000
    archive_on_server: /tmp/project-forms-image.tar
    volume_name: project-forms-data

  tasks:
    - name: Confirm Docker is installed and running
      ansible.builtin.command: docker info
      changed_when: false

    - name: Transfer image tarball from Jenkins machine to server
      ansible.builtin.copy:
        src: '{{ image_archive }}'
        dest: '{{ archive_on_server }}'
        mode: '0644'

    - name: Load Docker image on server
      ansible.builtin.command:
        argv: [docker, load, --input, '{{ archive_on_server }}']
      changed_when: true

    - name: Create persistent volume for SQLite
      ansible.builtin.command:
        argv: [docker, volume, create, '{{ volume_name }}']
      changed_when: false

    - name: Check existing container
      ansible.builtin.command:
        argv: [docker, container, inspect, '{{ container_name }}']
      register: previous_container
      failed_when: false
      changed_when: false

    - name: Remove previous container
      ansible.builtin.command:
        argv: [docker, rm, --force, '{{ container_name }}']
      when: previous_container.rc == 0
      changed_when: true

    - name: Start new application container
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --detach
          - --name
          - '{{ container_name }}'
          - --restart
          - unless-stopped
          - --publish
          - '{{ server_port }}:{{ container_port }}'
          - --volume
          - '{{ volume_name }}:/app/data'
          - '{{ image_name }}:{{ image_tag }}'
      changed_when: true

    - name: Verify Flask responds with HTTP 200 on Ubuntu server
      ansible.builtin.uri:
        url: 'http://127.0.0.1:{{ server_port }}/'
        status_code: 200
      register: response
      until: response.status | default(0) == 200
      retries: 15
      delay: 2
      changed_when: false

    - name: Delete transferred tarball after successful deploy
      ansible.builtin.file:
        path: '{{ archive_on_server }}'
        state: absent

    - name: Report application URL
      ansible.builtin.debug:
        msg: 'Deployment OK: http://{{ inventory_hostname }}:{{ server_port }}/'
